spring.application.name=aerix-food
spring.config.import=optional:file:./.local/application.properties
server.address=127.0.0.1
server.port=${PORT:8082}
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:food_ordering_assignment}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
app.seed-menu=${SEED_MENU:true}
server.error.include-message=never
logging.level.org.mongodb.driver=WARN

